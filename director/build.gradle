buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        mavenCentral()
    }
    dependencies {
        classpath 'com.anatawa12.forge:ForgeGradle:1.2-1.1.1'
    }
}

apply plugin: 'forge'
apply plugin: 'java'

group = 'com.sobrenaturaldirector'
version = '0.12.0-alpha'
archivesBaseName = 'SobrenaturalDirector'

sourceCompatibility = 1.8

minecraft {
    version = '1.7.10-10.13.4.1614-1.7.10'
    runDir = 'run'
}

repositories { mavenCentral() }

dependencies {
    testCompile 'junit:junit:4.13.2'
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'mcversion', '1.7.10'
    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version': project.version, 'mcversion': '1.7.10'
    }
    from(sourceSets.main.resources.srcDirs) { exclude 'mcmod.info' }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:all']
    options.fork = true
    options.forkOptions.executable = "${System.getenv('JAVA_HOME')}/bin/javac"
}

// ForgeGradle 1.2 defaults legacy tasks to Java 6; the foundation contract is Java 8.
afterEvaluate {
    tasks.withType(JavaCompile) {
        sourceCompatibility = '1.8'
        targetCompatibility = '1.8'
    }
}

jar {
    manifest {
        attributes 'Implementation-Title': 'Sobrenatural Director',
                'Implementation-Version': project.version
    }
}

task benchmarkFoundation(type: JavaExec, dependsOn: classes) {
    classpath = sourceSets.main.runtimeClasspath
    main = 'com.sobrenaturaldirector.benchmark.DirectorBenchmarkRunner'
    workingDir project.projectDir.parentFile
    systemProperty 'benchmark.outputDir', new File(project.projectDir.parentFile, 'runtime-tests/benchmark').absolutePath
}
